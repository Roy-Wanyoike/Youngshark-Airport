name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Airport-Frontend/package-lock.json
      - working-directory: Airport-Frontend
        run: npm ci
      - working-directory: Airport-Frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend_Development-master/backend/package-lock.json
      - working-directory: Backend_Development-master/backend
        run: npm ci
      - working-directory: Backend_Development-master/backend
        run: npm run build

  build-backgroundservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend_Development-master/BackgroundService/package-lock.json
      - working-directory: Backend_Development-master/BackgroundService
        run: npm ci
      - working-directory: Backend_Development-master/BackgroundService
        run: npm run build
